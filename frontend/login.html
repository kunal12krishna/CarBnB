<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarBnB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="icon" href="data:,">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 gradient-bg rounded-lg flex items-center justify-center">
                        <i data-lucide="car" class="w-5 h-5 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">CarBnB</h1>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5 inline mr-1"></i>
                        Back to Home
                    </a>
                    <button id="darkModeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        <i data-lucide="sun" class="w-5 h-5 text-gray-600 dark:text-gray-300 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 text-gray-600 dark:text-gray-300 hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Login/Signup Toggle -->
            <div class="text-center">
                <div class="flex justify-center mb-6">
                    <div class="bg-gray-200 dark:bg-gray-700 p-1 rounded-lg">
                        <button id="loginTab" class="px-6 py-2 rounded-md text-sm font-medium transition-colors bg-white dark:bg-gray-800 text-primary-600 dark:text-primary-400 shadow-sm">
                            Login
                        </button>
                        <button id="signupTab" class="px-6 py-2 rounded-md text-sm font-medium transition-colors text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                            Sign Up
                        </button>
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-800 dark:text-white">Welcome Back</h2>
                    <p class="text-gray-600 dark:text-gray-400 mt-2">Sign in to your CarBnB account</p>
                </div>

                <form class="space-y-6" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                        <input type="email" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="Enter your email">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="Enter your password">
                            <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                            <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">Forgot password?</a>
                    </div>

                    <button type="submit" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                        Sign In
                    </button>

                    <div class="text-center">
                        <span class="text-gray-600 dark:text-gray-400">Don't have an account? </span>
                        <button type="button" onclick="switchToSignup()" class="text-primary-600 dark:text-primary-400 hover:underline font-medium">Sign up</button>
                    </div>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 hidden">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-800 dark:text-white">Join CarBnB</h2>
                    <p class="text-gray-600 dark:text-gray-400 mt-2">Create your account to get started</p>
                </div>

                <form class="space-y-6" onsubmit="handleSignup(event)">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
                            <input type="text" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="John">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
                            <input type="text" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="Doe">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                        <input type="email" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="john@example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Phone Number</label>
                        <input id="signupPhone" type="tel" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="+91 98765 43210">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                        <input type="password" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white transition-colors" placeholder="Create a password">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">I want to</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="flex items-center p-4 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                <input type="radio" name="role" value="renter" class="w-4 h-4 text-primary-600 border-gray-300 focus:ring-primary-500" required>
                                <div class="ml-3">
                                    <div class="text-sm font-medium text-gray-800 dark:text-white">Rent Cars</div>
                                    <div class="text-xs text-gray-600 dark:text-gray-400">I want to rent cars</div>
                                </div>
                            </label>
                            <label class="flex items-center p-4 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                <input type="radio" name="role" value="owner" class="w-4 h-4 text-primary-600 border-gray-300 focus:ring-primary-500" required>
                                <div class="ml-3">
                                    <div class="text-sm font-medium text-gray-800 dark:text-white">List My Car</div>
                                    <div class="text-xs text-gray-600 dark:text-gray-400">I want to rent out my car</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" required class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                            I agree to the <a href="#" class="text-primary-600 dark:text-primary-400 hover:underline">Terms of Service</a> and <a href="#" class="text-primary-600 dark:text-primary-400 hover:underline">Privacy Policy</a>
                        </span>
                    </div>

                    <button type="submit" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                        Create Account
                    </button>

                    <div class="text-center">
                        <span class="text-gray-600 dark:text-gray-400">Already have an account? </span>
                        <button type="button" onclick="switchToLogin()" class="text-primary-600 dark:text-primary-400 hover:underline font-medium">Sign in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Form switching functionality
        function switchToSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginTab').classList.remove('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            document.getElementById('loginTab').classList.add('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
            document.getElementById('signupTab').classList.add('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            document.getElementById('signupTab').classList.remove('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
        }

        function switchToLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupTab').classList.remove('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            document.getElementById('signupTab').classList.add('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
            document.getElementById('loginTab').classList.add('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            document.getElementById('loginTab').classList.remove('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
        }

        // Tab click handlers
        document.getElementById('loginTab').addEventListener('click', switchToLogin);
        document.getElementById('signupTab').addEventListener('click', switchToSignup);

        // Form submission handlers
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const email = form.querySelector('input[type="email"]').value.trim();
            const password = form.querySelector('input[type="password"]').value;
            try {
                const resp = await fetch('/api/users/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!resp.ok) throw new Error('Invalid credentials');
                const data = await resp.json();
                const user = data.user;
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', user.role);
                localStorage.setItem('userName', user.name || 'User');
                localStorage.setItem('userId', String(user.id));
                // If there is a pending intent (like book), continue it
                const intentRaw = localStorage.getItem('postLoginRedirect');
                if (intentRaw) {
                    localStorage.removeItem('postLoginRedirect');
                    const intent = JSON.parse(intentRaw);
                    if (intent.action === 'book' && intent.carId) {
                        // Go back to index and trigger booking by selected car
                        localStorage.setItem('intentCarId', String(intent.carId));
                        window.location.href = 'index.html';
                        return;
                    }
                }
                showToast('Login successful! Redirecting to dashboard...', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            } catch (e) {
                showToast('Login failed. Check your email/password.', 'error');
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const form = event.target;
            const first = form.querySelector('input[placeholder="John"]').value.trim();
            const last = form.querySelector('input[placeholder="Doe"]').value.trim();
            const email = form.querySelector('input[type="email"]').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = form.querySelector('input[placeholder="Create a password"]').value;
            const role = new FormData(form).get('role');

            const indianPhoneRegex = /^(\+91\s?|0)?[6-9]\d{9}$/;
            if (!indianPhoneRegex.test(phone.replace(/\s+/g, ''))) {
                showToast('Enter a valid Indian mobile number (e.g., +91 9876543210)', 'error');
                return;
            }
            try {
                const resp = await fetch('/api/users/signup', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: `${first} ${last}`.trim(), email, phone, password, role })
                });
                if (!resp.ok) throw new Error('Signup failed');
                const data = await resp.json();
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', `${first} ${last}`.trim());
                localStorage.setItem('userId', String(data.id));
                showToast('Account created successfully! Redirecting to dashboard...', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            } catch (e) {
                showToast('Signup failed. Try a different email.', 'error');
            }
        }
    </script>
</body>
</html>
