<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpool - CarBnB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/carpool.css">
    <link rel="icon" href="data:,">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 gradient-bg rounded-lg flex items-center justify-center">
                        <i data-lucide="car" class="w-5 h-5 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">CarBnB</h1>
                </div>
                
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Home</a>
                    <a href="dashboard.html" class="text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Dashboard</a>
                </div>

                <div class="flex items-center space-x-4">
                    <button id="darkModeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        <i data-lucide="sun" class="w-5 h-5 text-gray-600 dark:text-gray-300 dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 text-gray-600 dark:text-gray-300 hidden dark:block"></i>
                    </button>
                    
                    <button class="md:hidden p-2 rounded-lg bg-gray-100 dark:bg-gray-700">
                        <i data-lucide="menu" class="w-5 h-5 text-gray-600 dark:text-gray-300"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="gradient-bg text-white py-16">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold mb-4">Share Your Journey</h2>
            <p class="text-xl text-blue-100 max-w-2xl mx-auto mb-8">
                Save money, meet new people, and reduce your carbon footprint by sharing rides with fellow travelers.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="showCreateTrip()" class="px-8 py-4 bg-white text-primary-600 rounded-lg font-semibold hover:bg-gray-100 transition-colors">
                    <i data-lucide="plus" class="w-5 h-5 inline mr-2"></i>
                    Offer a Ride
                </button>
                <button onclick="showFindTrip()" class="px-8 py-4 bg-transparent border-2 border-white text-white rounded-lg font-semibold hover:bg-white hover:text-primary-600 transition-colors">
                    <i data-lucide="search" class="w-5 h-5 inline mr-2"></i>
                    Find a Ride
                </button>
            </div>
        </div>
    </section>

    <!-- Toggle Buttons -->
    <section class="bg-white dark:bg-gray-800 py-8 sticky top-16 z-40 shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex justify-center">
                <div class="bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                    <button id="findTripBtn" class="px-6 py-2 rounded-md text-sm font-medium transition-colors bg-white dark:bg-gray-800 text-primary-600 dark:text-primary-400 shadow-sm">
                        Find a Ride
                    </button>
                    <button id="createTripBtn" class="px-6 py-2 rounded-md text-sm font-medium transition-colors text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
                        Offer a Ride
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Find Trip Section -->
    <section id="findTripSection" class="py-12">
        <div class="container mx-auto px-4">
            <!-- Search Form -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 mb-8">
                <h3 class="text-xl font-semibold text-gray-800 dark:text-white mb-6">Search for Rides</h3>
                <form class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">From</label>
                        <input id="carpoolFrom" type="text" placeholder="Departure city (e.g., Bengaluru)" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">To</label>
                        <input id="carpoolTo" type="text" placeholder="Destination city (e.g., Mysuru)" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Date</label>
                        <input id="carpoolDate" type="date" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="searchTrips()" class="w-full gradient-bg text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                            <i data-lucide="search" class="w-5 h-5 inline mr-2"></i>
                            Search
                        </button>
                    </div>
                </form>
            </div>

            <!-- Available Trips -->
            <div>
                <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">Available Rides</h3>
                <div id="tripsList" class="space-y-4">
                    <!-- Trips will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- Create Trip Section -->
    <section id="createTripSection" class="py-12 hidden">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-8">
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-8">Offer a Ride</h3>
                    
                    <form onsubmit="handleCreateTrip(event)" class="space-y-8">
                        <!-- Route Information -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Route Information</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Departure City</label>
                                    <input id="fromCityInput" type="text" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="e.g., Bengaluru">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Destination City</label>
                                    <input id="toCityInput" type="text" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="e.g., Mysuru">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Departure Date</label>
                                    <input id="departDateInput" type="date" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Departure Time</label>
                                    <input id="departTimeInput" type="time" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                </div>
                            </div>
                        </div>

                        <!-- Car and Capacity -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Vehicle & Capacity</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Your Car</label>
                                    <select id="carSelect" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                        <option value="">Select your car (from your listings)</option>
                                        <option value="__custom">Other (enter description)</option>
                                    </select>
                                    <input id="carDescInput" type="text" class="mt-2 w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white hidden" placeholder="e.g., Maruti Baleno (2021)">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Available Seats</label>
                                    <select id="seatsSelect" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white">
                                        <option value="">Number of seats</option>
                                        <option value="1">1 seat</option>
                                        <option value="2">2 seats</option>
                                        <option value="3">3 seats</option>
                                        <option value="4">4 seats</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Price per Seat</label>
                                    <div class="relative">
                                        <div class="absolute left-3 top-3 text-gray-600 dark:text-gray-400">₹</div>
                                        <input id="pricePerSeatInput" type="number" required min="50" max="10000" class="w-full pl-8 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="500">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Stops and Preferences -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Trip Details</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Planned Stops (Optional)</label>
                                    <input type="text" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="e.g., San Jose, Fresno (separate with commas)">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Additional Information</label>
                                    <textarea rows="3" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="Any specific requirements, music preferences, smoking policy, etc."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Preferences -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Passenger Preferences</h4>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                                    <span class="text-sm text-gray-700 dark:text-gray-300">No smoking</span>
                                </label>
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                                    <span class="text-sm text-gray-700 dark:text-gray-300">Pet friendly</span>
                                </label>
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                                    <span class="text-sm text-gray-700 dark:text-gray-300">Music allowed</span>
                                </label>
                                <label class="flex items-center space-x-3">
                                    <input type="checkbox" class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                                    <span class="text-sm text-gray-700 dark:text-gray-300">Quiet ride</span>
                                </label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-4">
                            <button type="submit" class="flex-1 gradient-bg text-white py-4 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                                <i data-lucide="upload" class="w-5 h-5 inline mr-2"></i>
                                Post Your Ride
                            </button>
                            <button type="button" class="px-8 py-4 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                Save Draft
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="/js/app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Tab switching functionality
        const findTripBtn = document.getElementById('findTripBtn');
        const createTripBtn = document.getElementById('createTripBtn');
        const findTripSection = document.getElementById('findTripSection');
        const createTripSection = document.getElementById('createTripSection');

        function showFindTrip() {
            findTripSection.classList.remove('hidden');
            createTripSection.classList.add('hidden');
            
            findTripBtn.classList.add('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            findTripBtn.classList.remove('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
            
            createTripBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            createTripBtn.classList.add('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
        }

        function showCreateTrip() {
            createTripSection.classList.remove('hidden');
            findTripSection.classList.add('hidden');
            
            createTripBtn.classList.add('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            createTripBtn.classList.remove('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
            
            findTripBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-primary-600', 'dark:text-primary-400', 'shadow-sm');
            findTripBtn.classList.add('text-gray-500', 'dark:text-gray-400', 'hover:text-gray-700', 'dark:hover:text-gray-200');
        }

        findTripBtn.addEventListener('click', showFindTrip);
        createTripBtn.addEventListener('click', showCreateTrip);

        // Load available trips from backend
        async function loadTrips(query={}) {
            const tripsList = document.getElementById('tripsList');
            try {
                const params = new URLSearchParams();
                if (query.from_city) params.append('from_city', query.from_city);
                if (query.to_city) params.append('to_city', query.to_city);
                if (query.date) params.append('date', query.date);
                const resp = await fetch(`/api/carpool/trips?${params.toString()}`);
                const list = resp.ok ? await resp.json() : [];
                if (list.length === 0) {
                    tripsList.innerHTML = `
                        <div class="text-center py-12">
                            <i data-lucide="car" class="w-16 h-16 text-gray-400 mx-auto mb-4"></i>
                            <p class="text-gray-600 dark:text-gray-400">No rides available for your search. Try different dates or locations.</p>
                        </div>
                    `;
                } else {
                    tripsList.innerHTML = list.map(trip => `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 card-hover">
                        <div class="flex items-center justify-between">
                            <div class="flex-1">
                                <div class="flex items-center space-x-4 mb-4">
                                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=48&h=48&fit=crop&crop=face" alt="Driver" class="w-12 h-12 rounded-full">
                                    <div>
                                        <h4 class="font-semibold text-gray-800 dark:text-white">${trip.driver_name || 'Driver'}</h4>
                                        <div class="flex items-center space-x-1">
                                            <i data-lucide="star" class="w-4 h-4 text-yellow-400 fill-current"></i>
                                            <span class="text-sm text-gray-600 dark:text-gray-400">4.8</span>
                                            <span class="text-sm text-gray-600 dark:text-gray-400">• ${trip.car_desc || ''}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                                    <div class="flex items-center space-x-2">
                                        <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 dark:text-white">${trip.from_city}</p>
                                            <p class="text-xs text-gray-600 dark:text-gray-400">From</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <i data-lucide="navigation" class="w-4 h-4 text-gray-400"></i>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 dark:text-white">${trip.to_city}</p>
                                            <p class="text-xs text-gray-600 dark:text-gray-400">To</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <i data-lucide="calendar" class="w-4 h-4 text-gray-400"></i>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 dark:text-white">${formatDate(trip.date)}</p>
                                            <p class="text-xs text-gray-600 dark:text-gray-400">${formatTime(trip.time)}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <i data-lucide="users" class="w-4 h-4 text-gray-400"></i>
                                        <div>
                                            <p class="text-sm font-medium text-gray-800 dark:text-white">${trip.available_seats}/${trip.seats} seats</p>
                                            <p class="text-xs text-gray-600 dark:text-gray-400">Available</p>
                                        </div>
                                    </div>
                                </div>
                                
                                
                            </div>
                            
                            <div class="text-right ml-6">
                                <div class="text-2xl font-bold text-primary-600 mb-2">₹${Number(trip.price_per_seat).toLocaleString('en-IN')}</div>
                                <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">per seat</p>
                                <button onclick="bookCarpoolSeat(${trip.id})" class="px-6 py-2 gradient-bg text-white rounded-lg font-medium hover:opacity-90 transition-opacity ${trip.available_seats === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${trip.available_seats === 0 ? 'disabled' : ''}>
                                    ${trip.available_seats > 0 ? 'Book Seat' : 'Full'}
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
                }
                lucide.createIcons();
            } catch (_) {
                tripsList.innerHTML = `<div class="text-center py-12 text-gray-600 dark:text-gray-400">Failed to load rides.</div>`;
            }
        }

        function searchTrips() {
            const from = (document.getElementById('carpoolFrom').value || '').trim();
            const to = (document.getElementById('carpoolTo').value || '').trim();
            const date = document.getElementById('carpoolDate').value || '';
            loadTrips({ from_city: from, to_city: to, date });
        }

        async function bookCarpoolSeat(tripId) {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userId = localStorage.getItem('userId');
            if (!isLoggedIn || !userId) {
                localStorage.setItem('postLoginRedirect', JSON.stringify({ action: 'carpool' }));
                showToast('Please login to book a carpool seat.', 'warning');
                window.location.href = 'login.html';
                return;
            }
            try {
                const resp = await fetch('/api/carpool/bookings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trip_id: tripId, user_id: Number(userId), seats: 1 })
                });
                if (!resp.ok) throw new Error('Booking failed');
                showToast('Seat booked successfully!', 'success');
                searchTrips();
            } catch (e) { showToast('Booking failed', 'error'); }
        }

        async function handleCreateTrip(event) {
            event.preventDefault();
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userId = localStorage.getItem('userId');
            if (!isLoggedIn) {
                localStorage.setItem('postLoginRedirect', JSON.stringify({ action: 'offerRide' }));
                showToast('Please login to post a ride.', 'warning');
                window.location.href = 'login.html';
                return;
            }
            const fromCity = document.getElementById('fromCityInput')?.value || '';
            const toCity = document.getElementById('toCityInput')?.value || '';
            const date = document.getElementById('departDateInput')?.value || '';
            const time = document.getElementById('departTimeInput')?.value || '';
            const seats = Number(document.getElementById('seatsSelect')?.value || 1);
            const pricePerSeat = Number(document.getElementById('pricePerSeatInput')?.value || 500);
            // car description from select or text input
            let carDesc = '';
            const carSel = document.getElementById('carSelect');
            if (carSel) {
                if (carSel.value === '__custom') {
                    carDesc = document.getElementById('carDescInput')?.value || '';
                } else if (carSel.value) {
                    carDesc = carSel.options[carSel.selectedIndex].textContent || '';
                }
            }
            if (!fromCity || !toCity || !date || !time || !seats || !pricePerSeat) {
                showToast('Please fill all the fields.', 'error');
                return;
            }
            try {
                const resp = await fetch('/api/carpool/trips', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: Number(userId), from_city: fromCity, to_city: toCity, date, time, seats, price_per_seat: pricePerSeat, car_desc: carDesc })
                });
                if (!resp.ok) throw new Error('Failed to post ride');
                showToast('Your ride has been posted successfully!', 'success');
                showFindTrip();
                searchTrips();
            } catch (e) { showToast('Failed to post ride', 'error'); }
        }

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.querySelectorAll('input[type="date"]').forEach(input => {
            input.min = today;
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            // populate car select from owner's listed cars
            const userId = localStorage.getItem('userId');
            const carSel = document.getElementById('carSelect');
            const carDescInput = document.getElementById('carDescInput');
            if (userId && carSel) {
                try {
                    const resp = await fetch(`/api/cars/seller/${userId}`);
                    if (resp.ok) {
                        const cars = await resp.json();
                        cars.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = String(c.id);
                            opt.textContent = `${c.make} ${c.model} (${c.year})`;
                            carSel.appendChild(opt);
                        });
                    }
                } catch (_) {}
                carSel.addEventListener('change', () => {
                    if (carSel.value === '__custom') {
                        carDescInput.classList.remove('hidden');
                    } else {
                        carDescInput.classList.add('hidden');
                    }
                });
            }
            loadTrips();
        });
    </script>
</body>
</html>
